services:
  - type: web
    name: examneeti-backend
    # Docker (not the plain Node buildpack) — the rich bulk-upload pipeline
    # needs LibreOffice on the server (see ./Dockerfile for why); Render's
    # managed Node runtime has no apt access to install it otherwise. The
    # app still runs fine without it (that one feature just degrades
    # gracefully), so switching back to `env: node` is safe if this image
    # ever becomes inconvenient — nothing else depends on Docker.
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    # Free plan RAM is tight for LibreOffice + Node running together —
    # fine for light dev/testing, but bump to Starter/Standard if bulk
    # uploads start failing/timing out under real use.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: TRUST_PROXY
        value: true
      - key: MONGO_URI
        sync: false
      - key: QUESTION_BANK_MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: 587
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Exam Neeti
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: AUTH_RATE_LIMIT_MAX
        value: 10
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MAX_CONCURRENCY
        value: 3
      - key: GEMINI_TIMEOUT_MS
        value: 30000
      - key: LIBREOFFICE_BIN
        value: soffice
      - key: LIBREOFFICE_TIMEOUT_MS
        value: 120000
